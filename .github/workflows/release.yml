# PyPI yayını.
#
# Kimlik doğrulama TOKEN'SIZ: PyPI'ın "trusted publishing" akışı kullanılıyor.
# Depoda saklanan uzun ömürlü bir API anahtarı yok; PyPI, GitHub'ın imzaladığı
# kısa ömürlü bir kimliği doğruluyor. Sızdırılacak bir sır olmaması, sırrı iyi
# saklamaktan daha güçlü bir korumadır.
#
# Bir kereye mahsus kurulum: pypi.org → proje → Publishing → GitHub sahibi,
# depo adı, iş akışı dosyası (release.yml) ve ortam (pypi) girilir.
name: release

on:
  push:
    tags: ['v*']

# v0.3.1 etiketi bu iş akışını aynı anda iki kez başlattı: biri yükledi, öteki
# "File already exists" ile düştü. Aynı etiket için tek çalışma, ve zaten
# yüklü dosya hata sayılmıyor; yeniden çalıştırma da böylece güvenli.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: PYTHONPATH=src python -m unittest discover -s tests

      # pyproject.toml'daki sürüm ile etiket aynı olmalı.
      - name: Sürüm etiketle eşleşiyor mu
        run: |
          ver=$(python -c "import tomllib,sys; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$ver" != "$tag" ]; then
            echo "pyproject.toml ($ver) ile etiket ($tag) uyuşmuyor" >&2
            exit 1
          fi

      - run: python -m pip install --upgrade build
      - run: python -m build

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
