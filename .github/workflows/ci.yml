# Yayın release.yml'de. Bu iş akışı testleri her gönderimde en düşük
# desteklenen (pyproject: >=3.9) ve güncel Python'da çalıştırır.
name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: PYTHONPATH=src python -m unittest discover -s tests
