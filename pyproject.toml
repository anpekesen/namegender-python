[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "genderscope"
version = "0.1.0"
description = "Official Python client for the GenderScope API"
requires-python = ">=3.9"
readme = "README.md"
license = "MIT"
authors = [{name = "GenderScope", email = "support@genderscope.io"}]
keywords = ["gender", "name", "api", "genderscope"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = []

[project.urls]
Homepage = "https://genderscope.io"
Documentation = "https://genderscope.io/docs"
Repository = "https://github.com/anpekesen/genderscope-python"
Issues = "https://github.com/anpekesen/genderscope-python/issues"

[tool.setuptools.packages.find]
where = ["src"]
